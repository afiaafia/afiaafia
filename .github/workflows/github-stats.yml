name: Update GitHub Activity Dashboard

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

  push:
    paths:
      - "scripts/generate-github-stats.js"
      - "scripts/generate-github-stats-gif.js"
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate GitHub dashboard
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          node scripts/generate-github-stats.js

      - name: Generate animated GIF
        run: |
          node scripts/generate-github-stats-gif.js

      - name: Commit generated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg assets/github-stats.gif

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update GitHub activity dashboard"
            git push
          fi
